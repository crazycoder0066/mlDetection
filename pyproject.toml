[project]
name = "mldetection"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "opencv-python<5",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.214",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
